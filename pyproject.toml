[project]
name = "sporadik"
dynamic = ["version"]
description = "a sparse array wire format: one axis made contiguous, written as a zarr prefix any object store can serve"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "zarr>=3.0",
]

[project.optional-dependencies]
# `read_sparse` hands a whole rank-two layout back as a `scipy.sparse` matrix, which is the one
# thing here that needs scipy. Reading slice by slice does not, and neither does writing: the
# writer duck-types `.data`/`.indices`/`.indptr`/`.format`, so a scipy matrix works as input
# without scipy being importable.
scipy = ["scipy>=1.11"]
# Writing into an object store rather than a directory. sporadik only ever hands zarr a store, so
# this is for callers who want one instead of a path.
obstore = ["obstore>=0.10"]
complete = ["scipy>=1.11", "obstore>=0.10"]

[tool.hatch.build.targets.sdist]
include = ["sporadik"]

[tool.hatch.build.targets.wheel]
include = ["sporadik"]

[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an older major after a
# new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter what is rendered --
# they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.pytest.ini_options]
# `testpaths` so a bare `pytest` runs the suite and nothing else -- without it a stray script or a
# doctest in the tree can join the run and fail it for reasons the package does not own.
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff==0.17.6",
    "basedpyright==1.40.2",
    "python-semantic-release>=9.21.0",
    "scipy>=1.11",
    "anndata>=0.10",
]
